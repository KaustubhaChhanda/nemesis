
services:
  # ─────────────────────────────────────────────
  # PostgreSQL — Source of Truth
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nemesis-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nemesis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nemesis_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-nemesis}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nemesis"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nemesis-net

  # ─────────────────────────────────────────────
  # Neo4j — Investigation Graph
  # ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: nemesis-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/nemesis_graph_2026}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - nemesis-net

  # ─────────────────────────────────────────────
  # Redis — Task Queue
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nemesis-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nemesis-net

  # ─────────────────────────────────────────────
  # Tor SOCKS Proxy + Hidden Services
  # ─────────────────────────────────────────────
  tor:
    build:
      context: ./onion-services/tor
      dockerfile: Dockerfile
    container_name: nemesis-tor
    ports:
      - "9050:9050"
    volumes:
      - tordata:/var/lib/tor
    depends_on:
      - forum
      - market
      - paste
    networks:
      - nemesis-net

  # ─────────────────────────────────────────────
  # Local Onion Services — Synthetic Darknet Data
  # ─────────────────────────────────────────────
  forum:
    build:
      context: ./onion-services/forum
      dockerfile: Dockerfile
    container_name: nemesis-forum
    volumes:
      - ./onion-services/forum:/app
    networks:
      - nemesis-net

  market:
    build:
      context: ./onion-services/market
      dockerfile: Dockerfile
    container_name: nemesis-market
    volumes:
      - ./onion-services/market:/app
    networks:
      - nemesis-net

  paste:
    build:
      context: ./onion-services/paste
      dockerfile: Dockerfile
    container_name: nemesis-paste
    volumes:
      - ./onion-services/paste:/app
    networks:
      - nemesis-net

  # ─────────────────────────────────────────────
  # Backend — FastAPI
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nemesis-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nemesis}:${POSTGRES_PASSWORD:-nemesis_secret_2026}@postgres:5432/${POSTGRES_DB:-nemesis}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-nemesis}:${POSTGRES_PASSWORD:-nemesis_secret_2026}@postgres:5432/${POSTGRES_DB:-nemesis}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nemesis_graph_2026}
      REDIS_URL: redis://redis:6379/0
      TOR_SOCKS_PROXY: socks5://tor:9050
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      PLAYWRIGHT_ENABLED: ${PLAYWRIGHT_ENABLED:-true}
      PLAYWRIGHT_TIMEOUT_MS: ${PLAYWRIGHT_TIMEOUT_MS:-30000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      tor:
        condition: service_started
    volumes:
      - ./backend/app:/app/app
      - tordata:/var/lib/tor:ro
    shm_size: '1gb'
    networks:
      - nemesis-net

  # ─────────────────────────────────────────────
  # Frontend — React (dev mode)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nemesis-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - nemesis-net

volumes:
  pgdata:
  neo4jdata:
  tordata:

networks:
  nemesis-net:
    driver: bridge
